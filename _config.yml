title: Coding
name: Coding
subtitle: Software engineering, architecture, systems, and lessons accumulated the hard way.
author:
  name: Jim Scott
url: "https://infoconex.github.io"
baseurl: "/coding-blog"
lang: en-US
timezone: America/Los_Angeles

markdown: kramdown
highlighter: rouge
permalink: pretty

# Apply the article layout to the migrated historical archive without modifying
# every Markdown file individually.
defaults:
  - scope:
      path: "post"
    values:
      layout: post

# GitHub Pages-supported plugins only. More can be added in the SEO/release issue.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - scripts/
  - README.md
  - Gemfile
  - Gemfile.lock

navigation:
  - title: Writing
    url: /writing/
  - title: Archive
    url: /archive/
  - title: About
    url: /about/

# Editable identity links consumed by About/footer components.
profile_links:
  - title: GitHub
    url: https://github.com/infoconex

default_theme: neo-industrial
