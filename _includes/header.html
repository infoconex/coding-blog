<header class="site-header">
  <div class="shell site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Coding home">CODING<span>.</span></a>
    <div class="site-header__actions">
      <nav class="site-nav" aria-label="Primary">
        {% for item in site.navigation %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
      <div class="site-header__utilities" aria-label="Site tools">
        <button type="button" class="search-trigger" data-search-trigger data-search-index="{{ '/search.json' | relative_url }}" aria-haspopup="dialog" aria-expanded="false" aria-label="Search">
          <span aria-hidden="true">⌕</span>
          <span class="search-trigger__label">Search</span>
          <kbd>⌘K</kbd>
        </button>
        {% include theme-picker.html %}
      </div>
    </div>
  </div>
</header>
