<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}" data-theme="{{ site.default_theme | default: 'neo-industrial' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.subtitle | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/themes.css' | relative_url }}">
  {% if page.stylesheet %}<link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">{% endif %}
  {% seo %}
  <script>
    (function () {
      try {
        var allowed = ['neo-industrial','midnight-editorial','warm-analog','technical-brutalism'];
        var saved = localStorage.getItem('coding-theme');
        if (allowed.indexOf(saved) !== -1) document.documentElement.dataset.theme = saved;
      } catch (_) {}
    }());
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include header.html %}
  <main id="main-content" class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
