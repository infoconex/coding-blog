<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  {% include security-policy.html %}
  <meta name="robots" content="noindex, follow">
  <title>Page moved · {{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.redirect.to | escape }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect.to | escape }}">
</head>
<body>
  <p>This page has moved. <a href="{{ page.redirect.to | escape }}">Continue to the new page</a>.</p>
</body>
</html>
