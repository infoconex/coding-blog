name: Validate content and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Test historical Markdown link parsing
        run: python -m unittest discover -s scripts -p 'test_validate_historical_links.py' -v

      - name: Validate historical content
        run: python scripts/validate.py

      - name: Check obsolete internal links
        run: python scripts/validate_internal_links.py

      - name: Check custom-domain migration safety
        run: python scripts/custom_domain_preflight.py

      - name: Test image link and alt text validation
        run: python -m unittest discover -s scripts -p 'test_validate_images.py' -v

      - name: Test Lighthouse diagnostic and regression checks
        run: python -m unittest discover -s scripts -p 'test_performance*.py' -v

  security:
    name: Audit Python dependencies and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependency and source security scanners
        run: python -m pip install --disable-pip-version-check pip-audit bandit

      - name: Block dependencies with known vulnerabilities
        run: python -m pip_audit -r scripts/requirements.txt

      - name: Block high-severity Python security findings
        run: bandit -r scripts --severity-level high --confidence-level medium --quiet
