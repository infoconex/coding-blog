name: Validate content

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate historical content
        run: python scripts/validate.py

      - name: Check custom-domain migration safety
        run: python scripts/custom_domain_preflight.py
