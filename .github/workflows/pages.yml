name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install social-card dependencies
        run: python3 -m pip install --user -r scripts/requirements.txt

      - name: Generate social cards
        continue-on-error: true
        run: python3 scripts/generate_og.py

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_SITE_URL: https://coding.infoconex.com
          INDEXNOW_KEY: eee4f749d0c04323ae181b596dd6529b
          INDEXNOW_KEY_LOCATION: https://coding.infoconex.com/eee4f749d0c04323ae181b596dd6529b.txt
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INDEXNOW_BACKFILL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[indexnow-backfill]') }}
        run: |
          if [ "$INDEXNOW_BACKFILL" = "true" ]; then
            python3 scripts/indexnow.py --all
          else
            python3 scripts/indexnow.py
          fi
