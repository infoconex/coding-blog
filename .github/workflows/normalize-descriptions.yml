name: Normalize descriptions

on:
  push:
    paths:
      - '.github/workflows/normalize-descriptions.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Normalize overlong descriptions
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import yaml

          root = Path('.')
          changed = []

          def shorten(text: str) -> str:
              text = text.strip().rstrip('…').rstrip()
              if len(text) <= 200:
                  return text

              # Prefer a complete sentence when one fits naturally.
              sentence_ends = [m.end() for m in re.finditer(r'[.!?](?:\s|$)', text)]
              usable = [end for end in sentence_ends if 80 <= end <= 195]
              if usable:
                  candidate = text[:usable[-1]].strip()
                  if 40 <= len(candidate) <= 200:
                      return candidate

              # Otherwise preserve the existing wording and trim at a word boundary.
              candidate = text[:194].rstrip()
              if ' ' in candidate:
                  candidate = candidate.rsplit(' ', 1)[0]
              candidate = candidate.rstrip(' ,;:-') + '…'
              return candidate

          for path in sorted(root.glob('post/*/*/*/*/index.md')):
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  continue
              parts = text.split('---', 2)
              if len(parts) != 3:
                  continue
              data = yaml.safe_load(parts[1]) or {}
              description = str(data.get('description') or '').strip()
              if len(description) <= 200:
                  continue

              replacement = shorten(description)
              if not 40 <= len(replacement) <= 200:
                  raise RuntimeError(f'{path}: generated description length {len(replacement)}')

              lines = parts[1].splitlines()
              replaced = False
              for index, line in enumerate(lines):
                  if line.startswith('description:'):
                      lines[index] = 'description: ' + json.dumps(replacement, ensure_ascii=False)
                      replaced = True
                      break
              if not replaced:
                  raise RuntimeError(f'{path}: description line not found')

              updated = '---\n' + '\n'.join(lines) + '\n---' + parts[2]
              path.write_text(updated, encoding='utf-8')
              changed.append((str(path), len(description), len(replacement), replacement))

          print(f'Updated {len(changed)} descriptions')
          for path, old_len, new_len, description in changed:
              print(f'{path}: {old_len} -> {new_len}: {description}')

      - name: Validate content
        run: python scripts/validate.py

      - name: Commit normalized descriptions and remove one-time workflow
        run: |
          git config user.name "Jim Scott"
          git config user.email "jscott@infoconex.com"
          git rm .github/workflows/normalize-descriptions.yml
          git add post
          git commit -m "Normalize blog post descriptions"
          git push
