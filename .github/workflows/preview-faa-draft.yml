name: Build FAA draft without deploying

on:
  pull_request:
    paths:
      - ".github/workflows/preview-faa-draft.yml"
      - "post/2026/11/16/when-a-network-problem-becomes-a-nationwide-ground-stop/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
      - name: Enable unpublished draft only in disposable runner workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("post/2026/11/16/when-a-network-problem-becomes-a-nationwide-ground-stop/index.md")
          content = path.read_text(encoding="utf-8")
          assert content.count("published: false") == 1, "Draft must be unpublished in repository"
          path.write_text(content.replace("published: false", "published: true", 1), encoding="utf-8")
          PY
      - name: Configure Pages build without deploying
        uses: actions/configure-pages@v6
      - name: Build temporary Jekyll preview
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Allow validation of generated site
        run: sudo chown -R "$(id -u):$(id -g)" _site
      - name: Validate rendered article exists
        run: test -s _site/post/2026/11/16/when-a-network-problem-becomes-a-nationwide-ground-stop/index.html
      - name: Check generated external links
        run: |
          python3 scripts/external_links.py --site-dir _site
          python3 scripts/external_links.py --site-dir _site --check
      - name: Check rendered SEO, sitemap, and security
        run: |
          python3 scripts/validate_seo.py --site-dir _site
          python3 scripts/validate_indexability.py --site-dir _site
          python3 scripts/validate_browser_security.py --site-dir _site
      - name: Check rendered images
        run: python3 scripts/validate_images.py --site-dir _site
