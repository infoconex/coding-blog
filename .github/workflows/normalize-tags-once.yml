name: Normalize historical tags once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-tags-once.yml'

permissions:
  contents: write

jobs:
  normalize-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install validation dependency
        run: python -m pip install pyyaml

      - name: Normalize article tags
        run: python scripts/normalize_tags_once.py

      - name: Validate repository
        run: python scripts/validate.py

      - name: Remove one-time cleanup files
        run: |
          rm scripts/normalize_tags_once.py
          rm .github/workflows/normalize-tags-once.yml

      - name: Commit normalized tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No tag normalization changes were needed."
            exit 0
          fi
          git commit -m "Normalize historical article tags"
          git push origin HEAD:main
