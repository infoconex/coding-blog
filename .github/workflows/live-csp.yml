name: Live CSP browser check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-csp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install pinned browser automation package
        run: python -m pip install --disable-pip-version-check playwright==1.56.0

      - name: Check production CSP and analytics network requests in Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python scripts/check_live_csp.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-csp-${{ github.run_number }}
          path: csp-reports/
          if-no-files-found: warn
          retention-days: 14
